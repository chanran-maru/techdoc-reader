<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>TechDoc Reader 단어장</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 380px; margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; font-size: 13px; color: #111827; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #e5e7eb; }
    h1 { font-size: 15px; margin: 0; }
    .count { color: #6b7280; font-weight: normal; font-size: 12px; margin-left: 4px; }
    .toolbar { display: flex; gap: 6px; padding: 10px 14px; }
    input[type=search] { flex: 1; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    button { border: 1px solid #d1d5db; background: #f9fafb; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    button:hover { background: #f3f4f6; }
    ul { list-style: none; margin: 0; padding: 0 14px 14px; max-height: 420px; overflow: auto; }
    li { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .word { font-weight: 600; }
    .tr { margin-top: 4px; }
    .ex { margin-top: 6px; color: #374151; white-space: pre-wrap; font-size: 12px; background: #f9fafb; padding: 6px; border-radius: 6px; }
    .meta { margin-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #9ca3af; }
    .meta a { color: #2563eb; text-decoration: none; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .del { border: none; background: none; color: #b91c1c; padding: 0; }
    .empty { color: #9ca3af; text-align: center; padding: 30px 0; }
    #status { padding: 0 14px 8px; color: #374151; }
  </style>
</head>
<body>
  <header>
    <h1>단어장<span class="count" id="count"></span></h1>
    <button id="settings">설정</button>
  </header>
  <div class="toolbar"><button id="enable">이 페이지에서 사용</button><button id="clear">단어장 전체 삭제</button></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="검색" />
    <button id="export">CSV 내보내기</button>
  </div>
  <ul id="list"></ul>
  <script src="security.js"></script>
  <script src="popup.js"></script>
</body>
</html>
